# Builds an unsigned iOS .ipa for local re-signing with AltStore and a free Apple ID.
name: iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple team ID that AltStore signs with (it appends it to the App Group)
        default: LSLLT984X3
        required: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      # AltStore registers App Groups as "<group>.<teamID>" and updates the entitlements,
      # but not the Info.plist key expo-widgets reads, so the app and widget stop sharing data.
      - name: Match widget App Group to AltStore signing
        env:
          TEAM_ID: ${{ inputs.team_id }}
        run: |
          plists=$(grep -rl --include=Info.plist ExpoWidgetsAppGroupIdentifier ios)
          test -n "$plists"
          for plist in $plists; do
            group=$(/usr/libexec/PlistBuddy -c 'Print :ExpoWidgetsAppGroupIdentifier' "$plist")
            /usr/libexec/PlistBuddy -c "Set :ExpoWidgetsAppGroupIdentifier $group.$TEAM_ID" "$plist"
            echo "$plist -> $group.$TEAM_ID"
          done

      - name: Build app without code signing
        run: |
          xcodebuild \
            -workspace ios/Expense.xcworkspace \
            -scheme Expense \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Entitlements only travel inside a code signature. Without one, AltStore sees no
      # App Groups to register. Ad-hoc signing embeds them without any Apple certificate.
      - name: Embed entitlements with ad-hoc signature
        run: |
          app=build/Build/Products/Release-iphoneos/Expense.app
          appex="$app/PlugIns/ExpoWidgetsTarget.appex"
          app_ent=$(find ios/Expense -maxdepth 1 -name '*.entitlements' | head -1)
          appex_ent=$(find ios/ExpoWidgetsTarget -maxdepth 1 -name '*.entitlements' | head -1)
          test -n "$app_ent" && test -n "$appex_ent"
          echo "App entitlements: $app_ent" && cat "$app_ent"
          echo "Widget entitlements: $appex_ent" && cat "$appex_ent"
          # Nested code must be signed before the bundles that contain it.
          find "$app" -depth \( -name '*.dylib' -o -name '*.framework' \) -print0 \
            | xargs -0 -I{} codesign --force --sign - {}
          codesign --force --sign - --entitlements "$appex_ent" "$appex"
          codesign --force --sign - --entitlements "$app_ent" "$app"
          codesign -d --entitlements - "$appex"
          codesign -d --entitlements - "$app"

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Expense.app Payload/
          zip -qr Expense-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Expense-unsigned-ipa
          path: Expense-unsigned.ipa
          retention-days: 7
