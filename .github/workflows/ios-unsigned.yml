# Builds an unsigned iOS .ipa for local re-signing (for example, with Sideloadly and a free Apple ID).
name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build app without code signing
        run: |
          xcodebuild \
            -workspace ios/Expense.xcworkspace \
            -scheme Expense \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Expense.app Payload/
          zip -qr Expense-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Expense-unsigned-ipa
          path: Expense-unsigned.ipa
          retention-days: 7
